/* BRIDGE Mobile First V2 — focused refinement: quiet motion, premium welcome */
:root{--ink:#34283d;--dim:#8a7f90;--violet:#6c507f;--base:#faf8fb;--shadow:0 11px 30px rgba(77,55,88,.055)}
html{scroll-behavior:auto}
.gateway{display:flex;align-items:center;justify-content:center;min-height:100svh;min-height:100dvh;padding:32px 18px 29px;background:radial-gradient(ellipse 64% 36% at 0% 0%,#fce6ef 0%,transparent 100%),radial-gradient(ellipse 70% 32% at 100% 100%,#eee6f6 0%,transparent 100%),#faf8fb}
.gateway-inner{width:min(810px,100%);animation:welcome-in .38s ease-out both}
.welcome-heading{text-align:center;margin-bottom:27px}
.gateway .hero-icon{width:68px;height:68px;margin:0 auto 13px;border-radius:22px;background:#f8eef6;box-shadow:0 3px 14px rgba(113,73,115,.065);border:1px solid #efe3ed}
.gateway .hero-icon img{width:46px;max-height:30px;object-fit:contain}
.g-title{font-size:clamp(38px,6vw,48px);letter-spacing:-1.6px;line-height:1.08;font-weight:800;color:#534067;margin:0}
.gateway .g-desc{font-size:12px;line-height:1.65;color:#94869a;margin:12px auto 0;max-width:310px;word-break:keep-all}
.welcome-divider{width:31px;height:2px;border-radius:5px;background:#d7bbce;margin:22px auto 0}
.welcome-picker{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 14px}
.welcome-picker .g-head{text-align:left;font-size:20px;line-height:1.4;font-weight:800;letter-spacing:-.85px;margin:0}
.welcome-picker p{margin:5px 0 0;font-size:12px;color:#8b8091}
.welcome-count{color:#9a809a;font:700 10px 'DM Sans',sans-serif;letter-spacing:.12em;white-space:nowrap;padding-bottom:4px}
.role-grid{gap:12px}
.role-tile{min-height:214px;background:#fff;border:1px solid #f0e9f0;border-radius:21px;box-shadow:0 6px 23px rgba(74,54,82,.055);transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease,transform .13s ease;isolation:isolate}
.role-tile:hover{transform:none;border-color:#e2cfdf;box-shadow:0 8px 25px rgba(74,54,82,.075)}
.role-tile:active{transform:scale(.992);background:#fdf9fd}
.role-tile img{height:118px;width:100%;object-fit:cover;object-position:center;transition:none}
.role-tile .role-pad{padding:16px 16px 15px}
.role-tile strong{font-size:19px;font-weight:800;line-height:1.35;color:#392b44;letter-spacing:-.5px}
.role-tile small{font-size:11px;line-height:1.6;word-break:keep-all;margin-top:5px;color:#837886}
.role-tile .role-go{position:absolute;right:15px;bottom:16px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#f7f0f7;color:#8a6b90;font-size:15px;font-weight:500;line-height:1}
.welcome-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 1px 0;margin-top:5px}
.entry-foot{margin:0;font-size:10px;color:#958798;text-align:left;line-height:1.6;letter-spacing:0}
.welcome-admin{font-size:11px;font-weight:700;border:1px solid #e7dce9;border-radius:12px;padding:9px 11px;background:#fff;color:#876a92;white-space:nowrap;transition:background-color .15s ease}
.welcome-admin:hover{background:#f8f1f8}
.welcome-admin:active{transform:scale(.99)}
.card{animation:none}
.btn{transition:background-color .16s ease,border-color .16s ease,filter .16s ease,transform .12s ease}
.btn:hover{filter:brightness(1.035)}
.btn:active{transform:scale(.99)}
.nav button,.tabs button,.bottomnav button,.round-btn{transition:background-color .18s ease,color .18s ease,border-color .18s ease;transform:none!important}
.modal-cover{animation:quiet-fade .18s ease-out both}
.modal{animation:modal-gentle .23s ease-out both}
.toast{animation:toast-soft .22s ease-out both}
@keyframes welcome-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes quiet-fade{from{opacity:0}to{opacity:1}}
@keyframes modal-gentle{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes toast-soft{from{opacity:0;transform:translate(-50%,5px)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:761px){.gateway .welcome-heading{margin-bottom:32px}.welcome-picker{margin-bottom:16px}.role-tile{min-height:229px}}
@media(max-width:760px){

.welcome-picker{margin-bottom:12px}
.welcome-picker .g-head{font-size:19px}

.welcome-count{font-size:9px}
.role-grid{display:grid;grid-template-columns:1fr;gap:10px}
.role-tile{display:flex;align-items:center;min-height:109px;border-radius:18px;overflow:hidden}
.role-tile img{width:39%;height:109px;max-width:none;object-fit:cover;object-position:center}
.role-tile .role-pad{padding:12px 39px 12px 15px;min-width:0;flex:1;justify-content:center}

}

.modal{min-width:0;overscroll-behavior-y:contain}
.modal .close{flex:0 0 40px;width:40px;height:40px;border-radius:13px}
.modal .row.between:first-child{position:sticky;top:-23px;z-index:1;background:#fff;padding:11px 0 12px;margin-top:-6px;margin-bottom:14px;border-bottom:1px solid var(--ui-line)}
.modal form .field.wide>.btn{min-height:50px}
.booking-summary{background:linear-gradient(145deg,#faf4fc,#fff7fb);border:1px solid #ebdeec;border-radius:18px;padding:17px;display:grid;gap:12px;margin-bottom:15px}
.booking-summary .summary-label{font-size:11px;color:#8b7892;font-weight:700}
.booking-summary .summary-title{font-size:17px;font-weight:800;color:#493857;margin:2px 0 0;line-height:1.5}
.booking-price-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:11px;border-top:1px solid #ede4ef}
.booking-price-row strong{font-size:18px;color:#634880;font-weight:800;white-space:nowrap}
.booking-policy{display:flex;gap:10px;align-items:flex-start;background:#fbf8fc;border:1px solid #efe6f0;border-radius:14px;padding:13px 12px;margin-top:1px;font-size:12px;line-height:1.75;color:#64536b;cursor:pointer}
.booking-policy input[type=checkbox]{margin:3px 0 0;flex:0 0 19px}
.booking-policy span{min-width:0}
.booking-footer{position:relative;display:grid;gap:8px;margin-top:6px}
.booking-footer .btn{width:100%;min-height:54px;font-size:14px;border-radius:14px}
.back-nav{display:inline-flex;align-items:center;justify-content:center;min-width:39px;min-height:39px;border:1px solid #eee5ef;border-radius:13px;background:#fff;color:#765c88;font-weight:800;font-size:17px;flex:none}
.mobile-page-tools{display:none}
@media(max-width:760px){
 html,body{width:100%;overflow-x:clip}
 .layout,.main,.app,.wrap{max-width:100%;min-width:0}
 .main{width:100%;max-width:560px;padding:14px 14px calc(102px + env(safe-area-inset-bottom))}
 .topline{position:relative;min-height:58px;gap:8px;margin-bottom:17px;align-items:center}
 .topline>div:first-child{flex:1;min-width:0}
 .topline .right{flex:none;gap:5px}
 .topline .eyebrow{font-size:9px;letter-spacing:1.3px;line-height:1.6}
 .screen-title{font-size:clamp(19px,5.6vw,24px);line-height:1.35;letter-spacing:-.6px;overflow-wrap:anywhere}
 .round-btn{height:42px;width:42px;flex:none}
 .mobile-page-tools{display:flex;align-items:center;margin:0 0 11px;gap:8px}
 .mobile-page-tools .back-nav{min-height:38px}
 .mobile-page-tools .crumb{font-size:12px;color:#927f9a;font-weight:650}
 .hero{min-height:160px;padding:22px;border-radius:20px;gap:9px}
 .hero h2{font-size:clamp(18px,5.3vw,23px);line-height:1.4;word-break:keep-all}
 .hero p{font-size:11.5px;line-height:1.7}
 .hero-icon2{font-size:35px;flex:none}
 .panel{padding:var(--ui-pad);border-radius:var(--ui-r);margin-bottom:var(--ui-g)}
 .card{padding:var(--ui-pad);border-radius:var(--ui-r)}
 .card h4{font-size:14px}
 .stat{padding:15px 13px;border-radius:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
 .stat strong{font-size:clamp(20px,6vw,26px);margin-top:6px}
 .stat small{font-size:11px;line-height:1.5}
 .grid2,.grid3{gap:var(--ui-g)}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .section-head{margin:22px 0 12px;flex-wrap:wrap}
 .section-head h3{font-size:16px;letter-spacing:-.4px;flex:1;min-width:150px}
 .section-head .btn{margin-left:auto}
 .stack{gap:var(--ui-g)}
 .extra-menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .extra-link{min-height:97px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:5px;position:relative;padding:15px 13px;border-radius:16px}
 .extra-link span:first-child{font-size:21px;width:auto}
 .extra-link b{line-height:1.5;font-size:12px;word-break:keep-all;padding-right:10px}
 .extra-link span:last-child{position:absolute;right:13px;top:14px;font-size:18px}
 .quick-links{margin-right:-14px;padding:12px 14px 13px 0;gap:8px}
 .quick-chip{flex:none;min-height:44px;font-size:12px}
 .actions{gap:9px;flex-wrap:wrap}
 .actions .btn{min-height:43px;flex-grow:1}
 .bottomnav{padding:5px 7px calc(6px + env(safe-area-inset-bottom));min-height:70px;box-shadow:0 -7px 24px rgba(72,51,83,.055);background:#fffefaed}
 .bottomnav button{min-height:56px;padding:5px 1px;display:flex;justify-content:center;gap:3px;border-radius:13px;line-height:1.3;font-size:10px;color:#82728b}
 .bottomnav button .bi{font-size:22px;line-height:1.25}
 .bottomnav button.selected{background:#f7edf8;color:#664779}
 .tabs button,.admin-tabs button{min-height:45px;font-size:12px}
 .modal-cover{align-items:flex-end;justify-content:stretch;padding:0}
 .modal{padding:20px 18px calc(18px + env(safe-area-inset-bottom));border-radius:23px 23px 0 0;width:100%;max-width:100%;max-height:min(92dvh,880px);-webkit-overflow-scrolling:touch}
 .modal h3{font-size:17px;line-height:1.45}
 .modal .row.between:first-child{top:-20px;padding-top:10px}
 .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
 .form-grid .field{font-size:12px}
 .form-grid .field.wide{grid-column:1/-1}
 .form-grid .field input,.form-grid .field select,.form-grid .field textarea{border-radius:12px;padding:12px 10px}
 .booking-footer{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));z-index:2;background:linear-gradient(#ffffffed,#fff);padding:12px 0 calc(11px + env(safe-area-inset-bottom));margin-bottom:calc(-11px - env(safe-area-inset-bottom))}
 .booking-summary{padding:15px}
 .booking-price-row strong{font-size:16px}
 .data-note{font-size:10px;line-height:1.7}
}
@media(max-width:360px){.main{padding-left:11px;padding-right:11px}.form-grid{grid-template-columns:1fr}.section-head h3{min-width:0}.hero-icon2{display:none}.extra-menu{gap:8px}.extra-link{padding:12px;min-height:94px}.bottomnav{padding-left:3px;padding-right:3px}.bottomnav button{font-size:9px}.screen-title{font-size:19px}}
@media(min-width:761px){.card{padding:19px}.grid2>*{height:100%}.modal{width:min(560px,100%)}}
@media(prefers-reduced-motion:reduce){.modal-cover,.modal,.toast,.gateway-inner{animation:none!important}}
</style></head><body><div id="root"></div><div id="modal-root"></div><script src="./app.js" defer></script></body></html>
