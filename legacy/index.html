function nav(){return MENUS.map(([tab,icon,txt])=>`<button class="${s.tab===tab?'active':''}" data-act="nav" data-tab="${tab}"><span class="nav-ico">${icon}</span>${s.role==='member'&&tab==='account'?'내 회원권':txt}</button>`).join('')+(s.role==='owner'?`<button class="${s.tab==='operations'?'active':''}" data-act="nav" data-tab="operations"><span class="nav-ico">▣</span>회원권·매출 관리</button>`:s.role==='teacher'?`<button class="${s.tab==='operations'?'active':''}" data-act="nav" data-tab="operations"><span class="nav-ico">▣</span>레슨 회원 관리</button>`:'') +(s.role==='teacher'?`<button class="${s.tab==='settlements'?'active':''}" data-act="nav" data-tab="settlements"><span class="nav-ico">▤</span>강사 정산</button>`:'')+(s.role==='member'?'':`<button class="${s.tab==='ads'?'active':''}" data-act="nav" data-tab="ads"><span class="nav-ico">✦</span>멤버십·모의 결제</button>`)}
function gateway(){return `<div class="screen gateway"><div class="welcome"><div class="gateway-brand-hero"><img class="gateway-selected-logo" src="assets/bridge_selected_semicircle.png" alt="반원형 BRIDGE 다리 로고"><div class="gateway-brand-name">BRIDGE</div><p class="gateway-brand-caption">수업과 사람을 잇는 연결.</p></div><h2 class="gateway-heading">당신은 어떤 연결을 찾고 있나요?</h2><div class="role-grid"><button class="role-card owner" data-act="role" data-role="owner"><span class="role-icon"><svg class="role-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01"/></svg></span><strong>원장</strong><small><span class="role-desc-pc">대강 공고 등록 · 스튜디오 운영</span><span class="role-desc-mobile">대강 공고 · 운영</span></small><span class="role-chevron" aria-hidden="true">›</span></button><button class="role-card teacher" data-act="role" data-role="teacher"><span class="role-icon"><svg class="role-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/></svg></span><strong>강사</strong><small><span class="role-desc-pc">대강 수락 · 전문 프로필 · 활동 관리</span><span class="role-desc-mobile">대강 수락 · 프로필</span></small><span class="role-chevron" aria-hidden="true">›</span></button><button class="role-card member" data-act="role" data-role="member"><span class="role-icon"><svg class="role-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></span><strong>회원</strong><small><span class="role-desc-pc">강사 탐색 · 태그 후기 · 레슨 예약</span><span class="role-desc-mobile">강사 찾기 · 레슨 예약</span></small><span class="role-chevron" aria-hidden="true">›</span></button></div><div class="gateway-features" aria-label="BRIDGE 주요 기능"><span>레슨 예약·결제</span><span>후기·커뮤니티</span><span>구인·구직 매칭</span></div><span class="demo-flag">가입 없이 체험할 수 있으며, 시연 데이터는 현재 브라우저에만 저장됩니다.</span><p class="gateway-foot">발표용 프로토타입으로 실제 결제·문자(SMS)·푸시 알림은 발생하지 않습니다.</p></div></div>`}
function shell(){return `<div class="shell"><aside class="side"><div class="side-brand"><div class="mini-mark">${ICON}</div><div><b>BRIDGE</b><small>CONNECT PEOPLE</small></div></div><div class="side-role"><small>현재 체험 역할</small><strong>${labelRole(s.role)} 모드</strong><button data-act="backroles">다른 역할로 체험하기 ↗</button></div><div class="nav">${nav()}</div><div class="side-end">BRIDGE · 시연<br>표시된 강사·후기·일정은 발표용 예시입니다.</div></aside><div class="mobile-role-switch" role="group" aria-label="시연 역할 전환">${[['owner','원장'],['teacher','강사'],['member','회원']].map(([r,label])=>`<button type="button" data-act="switchrole" data-role="${r}" class="${s.role===r?'active':''}" aria-pressed="${s.role===r}">${label}</button>`).join('')}</div><main class="main" id="main-content">${content()}</main><nav class="bottom-nav" aria-label="모바일 메뉴">${MENUS.map(([tab,icon,txt])=>`<button class="${s.tab===tab?'active':''}" data-act="nav" data-tab="${tab}"><span>${icon}</span>${s.role==='member'&&tab==='account'?'내 회원권':txt}</button>`).join('')}</nav></div>`}
function teacherCard(t){return `<div class="teacher-card"><div class="avatar">${esc(t.initial)}</div><div class="teacher-info"><strong>${esc(t.name)} 강사</strong><small>${esc(t.type)} · 경력 ${t.year}년 · ${esc(t.distance)} · 보정 이행률 ${adjustedRate(t)}%</small>${tags(t.tags,2)}</div>${btn('프로필 보기','profile','outline tiny',`data-id="${t.id}"`)}</div>`}
function jobsSummary(){const active=s.jobs.filter(j=>j.status==='open').length;const matched=s.jobs.filter(j=>j.status==='matched').length;return `<div class="tile-grid"><div class="tile"><small>모집 중 대강</small><strong>${active}건</strong></div><div class="tile"><small>확정된 매칭</small><strong>${matched}건</strong></div><div class="tile"><small>등록 강사</small><strong>${TEACHERS.length}명</strong></div></div>`}
function teacherIncomingHomeList(){
 const t=teacher(s.teacherId);
 const requests=s.bookings.filter(b=>b.status==='pending'&&b.teacherId===s.teacherId);
 const jobs=s.jobs.filter(j=>j.status==='open'&&j.type===t?.type);
 if(!requests.length&&!jobs.length)return `<div class="glass empty">현재 나를 기다리고 있는 공고나 개인 레슨 요청이 없어요.</div>`;
 const bookingCards=requests.map(b=>`<div class="glass panel reservation-card"><div class="summary-top"><strong>개인 레슨 요청 · ${esc(b.memberName||'시연 회원')} 회원 · ${esc(b.type)}</strong><span class="status wait">예약 수락 대기</span></div><p class="note">${esc(b.date)} ${esc(b.time)} · 신청 회원 ${esc(b.memberName||'시연 회원')}</p><small class="muted">회원이 신청한 개인 레슨입니다.</small><div class="btn-row">${btn('예약 수락','acceptbooking','primary',`data-id="${b.id}"`)}</div></div>`);
 const jobCards=jobs.map(j=>`<div class="glass panel reservation-card"><div class="summary-top"><strong>대강 공고 · ${esc(j.type)} ${esc(j.lesson)} · ${esc(j.location)}</strong><span class="status wait">모집 중</span></div><p class="note">${esc(j.date)} ${esc(j.time)} · 강사료 ${Number(j.fee||0).toLocaleString()}원 (예시)</p><small class="muted">동일 종목 강사 모집 공고</small><div class="btn-row">${btn('이 공고 지원하기','acceptjob','primary',`data-id="${j.id}"`)}</div></div>`);
 return `<div class="feed">${[...bookingCards,...jobCards].join('')}</div>`;
}
function memberWaitingJobs(compact=false){
 if(s.role!=='member')return '';
 const jobs=s.jobs.filter(j=>j.status==='matched'&&j.lesson==='그룹'&&isGroupParticipant(j)&&!j.memberAck?.[memberName()]&&!j.memberCancelled?.[memberName()]);
 const cards=jobs.map(j=>`<article class="bridge-member-waiting-card"><div class="summary-top"><strong>${esc(j.type)} 그룹 수업 · ${esc(j.location)}</strong><span class="status wait">수업 강사 안내</span></div><p class="bridge-job-meta">${esc(j.date)} ${esc(j.time)} · 이번 수업은 <strong>${esc(teacher(j.teacherId)?.name||'지정된')} 강사</strong>가 진행합니다.</p><p class="bridge-pay-status">이미 확정된 그룹 수업입니다. 강사 변경으로 재결제하거나 회원권을 추가 차감하지 않습니다. 취소 시 기존 회원권 회차는 복구 대상입니다.</p><div class="bridge-job-actions">${btn('확인했습니다','ackteacher','outline',`data-id="${esc(j.id)}"`)}${btn('예약 취소','cancelchangedclass','outline',`data-id="${esc(j.id)}"`)}</div></article>`).join('');
 return `<section class="bridge-member-pending"><div class="section-heading"><h3>수업 강사 안내 <span class="status wait">${jobs.length}건</span></h3>${compact?'<button data-act="nav" data-tab="reservations">전체보기 →</button>':''}</div>${cards||'<div class="glass empty">현재 새로운 수업 강사 안내가 없어요.</div>'}</section>`;
}
function home(){let t=teacher(s.teacherId);return `${pageTop({owner:'오늘의 스튜디오',teacher:'새로운 수업 기회를 발견하세요',member:'나에게 맞는 강사를 발견하세요'}[s.role])}<div class="hero"><span class="eyebrow">${s.role==='owner'?'센터 운영':s.role==='teacher'?'강사 연결':'강사 찾기'}</span><h3>${s.role==='owner'?'급한 대강도, 믿을 수 있게.':s.role==='teacher'?'경험이 쌓일수록, 더 많은 연결.':'검증된 후기부터 나에게 맞는 수업까지.'}</h3><p>${s.role==='owner'?'같은 종목의 강사에게 공고를 전달하고 수락을 확인하세요.':s.role==='teacher'?'센터를 넘어 이어지는 나의 활동과 후기를 관리하세요.':'강사를 비교하고 수업을 예약하는 과정을 체험하세요.'}</p></div><div class="bridge-feature-toolbar">${s.role==='member'?'':btn(s.role==='owner'?'센터 운영·매출':'레슨 회원 관리','nav','outline','data-tab="operations"')}${s.role==='member'?'':btn('멤버십 시연','nav','outline','data-tab="ads"')}</div>${s.role==='member'?`<div class="bridge-member-picker"><strong>시연 회원 선택</strong>${BRIDGE_MEMBERS.map(m=>`<button class="btn ${s.memberId===m.id?'primary':'outline'}" data-act="pickmember" data-id="${m.id}">${m.name} · ${m.label}</button>`).join('')}</div>`:''}${bridgeGallery()}<div class="cols"><div>${s.role==='owner'?`<div class="section-heading"><h3>운영 현황</h3></div>${jobsSummary()}<p class="tiny-note">대강 성사 시 원장에게 건당 1,500원(시연 청구). 구독료와 별개이며 실제 결제는 발생하지 않습니다.</p><div class="content-banner"><div><strong>새 대강 공고 등록</strong><small>원하는 종목·시간·장소를 입력하세요.</small></div>${btn('공고 작성','jobform','primary')}</div>`:s.role==='teacher'?`<div class="content-banner"><div><strong>현재 체험 강사: ${esc(t.name)}</strong><small>${esc(t.type)} · 보정 이행률 ${adjustedRate(t)}%</small></div>${btn('강사 변경','pickteacher','outline')}</div><div class="tile-grid"><div class="tile"><small>대강 이행률</small><strong>${adjustedRate(t)}%</strong></div><div class="tile"><small>출강 완료</small><strong>${t.done}건</strong></div><div class="tile"><small>추천 태그</small><strong>${t.tags.length}개</strong></div></div>`:`<div class="content-banner"><div><strong>강사에게 레슨을 예약해 보세요</strong><small>모의 결제는 실제 금전 거래가 아닙니다.</small></div>${btn('주변 강사 찾기','nearby','primary')}</div>${memberWaitingJobs(true)}`}<div class="section-heading"><h3>${s.role==='teacher'?'지원 가능한 공고':'추천 강사'}</h3><button data-act="nav" data-tab="${s.role==='teacher'?'reservations':'teachers'}">전체보기 →</button></div>${s.role==='teacher'?teacherIncomingHomeList():`<div class="teacher-list">${TEACHERS.slice(0,3).map(teacherCard).join('')}</div>`}<div class="section-heading"><h3>최근 커뮤니티</h3><button data-act="nav" data-tab="community">더보기 →</button></div><div class="home-post-feed">${posts().slice(0,2).map(postCard).join('')}</div></div><div class="sidebar-panel">${featuredTeacherBanner()}<div class="panel glass"><div class="section-heading" style="margin-top:0"><h3>BRIDGE 가이드</h3></div>${s.role==='owner'?`<p class="note">원장님을 위한 대강 운영 안내와 태그 후기 확인 메뉴입니다.</p><div class="flow-row"><span class="number">1</span><div><strong>${s.role==='owner'?'대강 공고 등록':s.role==='teacher'?'강사 프로필 확인':'후기와 강사 비교'}</strong><small>믿을 수 있는 연결을 시작하세요</small></div></div><div class="flow-row"><span class="number">2</span><div><strong>${s.role==='owner'?'지원 강사 프로필·이행률 검토':s.role==='teacher'?'대강 공고 수락':'수업 예약 신청'}</strong><small>예약과 매칭은 별개의 과정</small></div></div><div class="flow-row"><span class="number">3</span><div><strong>${s.role==='member'?'모의 예약금 확인':'확정 내역 확인'}</strong><small>발표용 시연 데이터 저장</small></div></div></div><p class="note">지원 강사 확정 후 회원에게 변경 알림이 표시됩니다.</p>${btn('후기 태그 보러가기','nav','outline block','data-tab="reviews"')}</div>`:`<div class="flow-row"><span class="number">1</span><div><strong>역할별 이용 안내</strong><small>공고와 예약을 확인하세요.</small></div></div>${btn('후기 태그 보러가기','nav','outline block','data-tab="reviews"')}</div>`}</div></div>`}
function teachers(){let q=s.search.trim().toLowerCase(),list=TEACHERS.filter(t=>hongdaeNearby(t)&&(s.teacherFilter==='전체'||t.type===s.teacherFilter)&&(!q||[t.name,t.type,t.city,t.cert,...t.tags].join(' ').toLowerCase().includes(q)));return `${pageTop('강사 찾기','홍대입구역 중심 반경 5km · 요가·필라테스 강사 시연 검색')}<div class="nearby-banner"><div><strong>내 주변 강사 · 지도형 보기</strong><small>홍대입구역 기준 반경 5km · 시연용 거리로 비교합니다.</small></div>${btn('지도에서 보기','nearby','primary')}</div><div class="panel glass"><div class="field"><label>이름·종목·자격증·태그 검색</label><input id="teacher-query" value="${esc(s.search)}" placeholder="예: 요가, 자세 교정, 김서연" autocomplete="off"></div><div class="filter-bar">${['전체','필라테스','요가'].map(x=>`<button class="filter ${s.teacherFilter===x?'active':''}" data-act="tfilter" data-value="${x}">${x}</button>`).join('')}</div><div class="summary-top"><strong>검색 결과 ${list.length}명</strong><small class="muted">홍대 기준 5km · 시연용 거리</small></div><div class="separator"></div><div class="teacher-list" id="teacher-results">${list.length?list.map(teacherCard).join(''):'<div class="empty">검색 조건에 맞는 강사가 없습니다.</div>'}</div></div>`}
function teacherDetail(t){let has=s.bookings.filter(b=>b.teacherId===t.id&&b.status==='confirmed').length;return `<div class="detail-hero"><div class="avatar">${esc(t.initial)}</div><div><h3>${esc(t.name)} 강사</h3><p>${esc(t.type)} · ${t.year}년 경력 · ${esc(t.city)}</p><span class="status">대강 보정 이행률 ${adjustedRate(t)}% (${t.done}/${t.assign})</span></div></div><div class="separator"></div><h4>전문 소개</h4><p class="note">${esc(t.bio)}</p><h4>자격·활동</h4><p class="note">${esc(t.cert)}</p><h4>후기 태그</h4>${tags(t.tags,10)}<p class="tiny-note">시연용 태그와 활동 기록입니다. 실제 자격 검증 결과가 아닙니다.</p><div class="btn-row">${s.role==='member'?btn('레슨 예약하기','book','primary block',`data-id="${t.id}"`):btn('강사 비교하기','compare','outline block')}</div>${has?`<p class="tiny-note">이 브라우저에서 완료한 레슨 예약 ${has}건</p>`:''}`}
function defaultReviews(){
 const positive=TEACHERS.slice(0,4).map((t,i)=>({id:'seed'+i,teacherId:t.id,author:['수강 회원 A','수강 회원 B','센터 원장','수강 회원 C'][i],tags:t.tags.slice(0,2),body:['수업 흐름을 차분하게 안내해 주셨어요.','자세를 이해하기 쉽게 알려주셨어요.','시간 약속을 잘 지켜주셨어요.','초보자도 따라갈 수 있도록 도와주셨어요.'][i],verified:true,private:false,seed:true}));
 // Demonstration-only, fictional improvement feedback. Private to the selected instructor role.
 const improvement=[
  {id:'seed-improve-lee',teacherId:'lee',author:'수강 회원 D',tags:['수업 속도 조절이 필요해요'],body:'진도가 조금 빨라서 몇몇 동작을 따라가기 어려웠어요. 중간에 설명할 시간을 조금 더 주시면 좋겠어요.',verified:false,private:true,seed:true},
  {id:'seed-improve-jung',teacherId:'jung',author:'수강 회원 E',tags:['초보자 난이도 조절이 필요해요'],body:'초보자인데 수업 강도가 조금 높게 느껴졌어요. 쉬운 동작도 함께 안내해 주시면 좋겠어요.',verified:false,private:true,seed:true},
  {id:'seed-improve-park',teacherId:'park',author:'수강 회원 F',tags:['수업 시작 시간 확인이 필요해요'],body:'수업 시작 시간보다 조금 늦게 오셔서 아쉬웠어요. 다음에는 정시에 시작해 주시면 좋겠어요.',verified:false,private:true,seed:true}
 ];
 return [...positive,...improvement];
}
function allReviews(){return [...s.reviews,...defaultReviews()]}
function reviews(){
 const allowedPrivate=s.role==='teacher';
 const list=allReviews().filter(r=>
  (s.filter==='전체'||teacher(r.teacherId)?.type===s.filter)&&
  (!r.private||(allowedPrivate&&r.teacherId===s.teacherId))&&
  (s.reviewVisibility!=='비공개'||!allowedPrivate||!!r.private)
 );

function scheduleDate(date,time){
 const parts=String(date||'').match(/(\d{4})-(\d{2})-(\d{2})/);
 if(!parts)return `<span class="schedule-day"><b>일정</b><small>${esc(date||'미정')}</small></span>`;
 const d=new Date(Number(parts[1]),Number(parts[2])-1,Number(parts[3]));
 const day=['일','월','화','수','목','금','토'][d.getDay()];
 return `<span class="schedule-day"><small class="schedule-weekday">${day}요일</small><b class="schedule-monthday">${Number(parts[2])}/${Number(parts[3])}</b><span class="schedule-time">${esc(time||'시간 미정')}</span></span>`;
}
function scheduleRecord(title,date,time,details,state,actions=''){

function content(){return {home,teachers,reviews,community,reservations,account,operations,ads,settlements:teacherSettlements}[s.tab]()+`<footer class="demo-page-footer" aria-label="서비스 체험 안내">BRIDGE 2.1 · 통합 수정 시연용 · 모든 이행률·회원·강사·요금 기록은 가상 데이터이며 실제 송금이 발생하지 않습니다.</footer>`}function alignDesktopCards(){
  if(window.innerWidth<=760)return;
  const main=document.getElementById('main-content');if(!main)return;
  // Only coordinate corresponding cards on paired reservation columns.
  const board=main.querySelector('.reservations-board');
  if(!board)return;
  const columns=Array.from(board.children).filter(el=>el.querySelector('.section-heading'));
  if(columns.length!==2)return;
  const groups=columns.map(col=>Array.from(col.querySelectorAll(':scope > .feed > .reservation-card')));
  for(const cards of groups)for(const el of cards){el.style.minHeight='0px';el.style.height='auto';}
  for(let i=0;i<Math.max(...groups.map(g=>g.length));i++){
    const pair=groups.map(g=>g[i]).filter(Boolean);
    if(pair.length<2)continue;
    // Match corresponding heading, description, metadata and action rows, not just outer card heights.
    const lanes=['.summary-top','.note','.tiny-note','.btn-row'];
    for(const selector of lanes){
      const nodes=pair.map(card=>card.querySelector(selector));
      for(const el of nodes)if(el)el.style.minHeight='0px';
      if(nodes.some(el=>!el))continue;
      const rowHeight=Math.ceil(Math.max(...nodes.map(el=>el.getBoundingClientRect().height)));
      for(const el of nodes)el.style.minHeight=rowHeight+'px';
    }
    for(const el of pair)el.style.minHeight='0px';
    const height=Math.ceil(Math.max(...pair.map(el=>el.getBoundingClientRect().height)));
    for(const el of pair)el.style.minHeight=height+'px';
  }
}
function translateMemberTerms(root){
 if(!root || s.role!=='member')return;
 const rules=[
  [/확정된 대강 예약/g,'확정된 수업 예약'],
  [/대강 수업 예약/g,'수업 예약'],
  [/대강 예약/g,'수업 예약'],
  [/대강 강사 변경 동의/g,'예약 확인'],
  [/담당 강사 변경/g,'수업 진행 안내'],
  [/대강 매칭/g,'수업 예약'],
  [/대강 공고/g,'수업 안내'],
  [/대강 강사/g,'수업 강사'],
  [/대강 이행률/g,'수업 이행률'],
  [/대강 일정/g,'수업 일정'],
  [/대강 수업/g,'수업'],
  [/대강 출강/g,'수업 진행'],
  [/대강 지원/g,'수업 신청'],
  [/대강/g,'수업']
 ];
 const convert=str=>rules.reduce((v,[a,b])=>v.replace(a,b),str);
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const texts=[];while(walker.nextNode()){const n=walker.currentNode;if(n.parentElement?.closest('script,style'))continue;if(n.nodeValue.includes('대강'))texts.push(n)}
 texts.forEach(n=>n.nodeValue=convert(n.nodeValue));
 root.querySelectorAll('[aria-label],[title],[placeholder]').forEach(el=>{
  for(const attr of ['aria-label','title','placeholder']){const v=el.getAttribute(attr);if(v?.includes('대강'))el.setAttribute(attr,convert(v))}
 });
}

<script>
/* V6.4 mobile-only visual settings; independent from app re-render. */
(function(){
  const ids=['mobile-font-range','mobile-line-range','mobile-pad-range'];
  const defaults=[100,170,16];
  let stored=defaults;
  try{const v=JSON.parse(localStorage.getItem('bridge_mobile_type_v1')||'null');if(Array.isArray(v)&&v.length>=3)stored=v.slice(0,3);}catch(_){}
  const doc=document.documentElement;
  const controls=ids.map(id=>document.getElementById(id));
  const bounded=controls.map((el,i)=>Math.max(+el.min,Math.min(+el.max,Number(stored[i])||defaults[i])));
  function apply(values,save){
    doc.style.setProperty('--bridge-mobile-font',String(values[0]/100));
    doc.style.setProperty('--bridge-mobile-line',String(values[1]/100));
    doc.style.setProperty('--bridge-mobile-pad',values[2]+'px');
    doc.style.setProperty('--bridge-mobile-gateway','1.15');
    controls.forEach((el,i)=>el.value=String(values[i]));
    document.getElementById('mobile-font-value').textContent=values[0]+'%';
    document.getElementById('mobile-line-value').textContent=(values[1]/100).toFixed(2);
    document.getElementById('mobile-pad-value').textContent=values[2]+'px';
    
    if(save)try{localStorage.setItem('bridge_mobile_type_v1',JSON.stringify(values));}catch(_){}
  }
  apply(bounded,false);
  controls.forEach(el=>el.addEventListener('input',()=>apply(controls.map(c=>Number(c.value)),true)));
  const toggle=document.getElementById('mobile-type-toggle'),panel=document.getElementById('mobile-type-panel');
  toggle.addEventListener('click',()=>{panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',String(!panel.hidden));toggle.textContent=panel.hidden?'글씨 조정':'조정 닫기';});
  document.getElementById('mobile-type-reset').addEventListener('click',()=>apply(defaults,true));
})();
</script>

    if(el.closest('script,style,svg,select,textarea,input,option,[contenteditable],.bridge-typography-sheet'))return false;
    if(el.matches('svg,section,article,ul,form,nav,header,footer,aside,main'))return false;
    if(el.children.length)return false;
    if(!el.textContent||!el.textContent.trim()||el.textContent.trim().length>650)return false;
    return /^(H[1-6]|P|SMALL|STRONG|B|SPAN|LABEL|BUTTON|A|TIME|DIV|LI|TD|TH)$/.test(el.tagName)
      || el.matches('.empty,.note,.tiny-note,.eyebrow,.identity,.post-cat');
  }
  function itemKey(el){
    if(!el.dataset.bridgeOriginal)el.dataset.bridgeOriginal=el.textContent.trim();
    // Text is included in the key to avoid applying one instructor's review to another.
    return scope()+'|'+el.tagName+'|'+el.dataset.bridgeOriginal;
  }
  function apply(el){
    if(!isCandidate(el))return;
    const key=itemKey(el),device=mode(),val=db[device][key];
    // Compatibility for mobile edits saved in the previous release.
    const fallback= device==='mobile'?legacy[el.tagName.toLowerCase()+'|'+el.dataset.bridgeOriginal]:null;
    const text=val&&typeof val.text==='string'?val.text:typeof fallback==='string'?fallback:null;
    if(text!==null&&text.trim()){
      if(el.textContent!==text)el.textContent=text;
      el.setAttribute('data-bridge-copy-overridden','');
    }else{
      if(el.textContent!==el.dataset.bridgeOriginal)el.textContent=el.dataset.bridgeOriginal;
      el.removeAttribute('data-bridge-copy-overridden');
    }
    const align=(val&&['left','center','right'].includes(val.align))?val.align:null;
    el.style.textAlign=align||'';
    if(align){
      if(['SPAN','B','STRONG','SMALL'].includes(el.tagName)&&!el.closest('.tag,.status,.filter-bar,.tags'))el.style.display='block';
    }else{el.style.removeProperty('display')}
    el.classList.add('bridge-copy-target');
  }
  function refresh(){
    document.querySelectorAll('#app *,#overlay-root *').forEach(apply);
  }
  const obs=new MutationObserver(()=>{
    if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;refresh()})}
  });
  obs.observe(document.getElementById('app'),{subtree:true,childList:true});
  obs.observe(document.getElementById('overlay-root'),{subtree:true,childList:true});
  refresh();
  function toggleChoice(device,enabled){
    choosing=enabled?device:null;
    document.body.classList.toggle('bridge-copy-selecting',!!choosing);
    for(const d of ['mobile','desktop'])picks[d].textContent=choosing===d?'선택 취소':'문구 선택 · 줄바꿈/정렬';
  }
  for(const device of ['mobile','desktop']){
    picks[device].addEventListener('click',()=>{
      const enabled=choosing!==device;toggleChoice(device,enabled);if(enabled)panels[device].hidden=true;
    });
    const editor=document.getElementById(device+'-copy-editor');
    const entry=document.getElementById(device+'-copy-text');
    const choices=Array.from(editor.querySelectorAll('[data-copy-align]'));
    let chosenAlign='left';
    function chooseAlign(v){chosenAlign=v;choices.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.copyAlign===v)))}
    choices.forEach(b=>b.addEventListener('click',()=>chooseAlign(b.dataset.copyAlign)));
    document.getElementById(device+'-copy-save').addEventListener('click',()=>{
      if(!current||current.device!==device)return;
      const val=entry.value.trim();if(!val){alert('문구를 입력해 주세요.');return;}
      db[device][current.key]={text:val.slice(0,650),align:chosenAlign};save();
      refresh();editor.hidden=true;
    });
    document.getElementById(device+'-copy-clear').addEventListener('click',()=>{
      if(!current||current.device!==device)return;
      delete db[device][current.key];
      if(device==='mobile'){delete legacy[current.el.tagName.toLowerCase()+'|'+current.original];try{localStorage.setItem('bridge_mobile_copy_breaks_v1',JSON.stringify(legacy))}catch(_){}}
      save();current.el.textContent=current.original;refresh();entry.value=current.original;editor.hidden=true;
    });
    picks[device].addEventListener('bridge-open-editor',()=>{editor.hidden=false});
  }
  document.addEventListener('click',function(ev){
    if(!choosing||choosing!==mode())return;
    if(ev.target.closest('#mobile-type-panel,#mobile-type-toggle,#desktop-type-panel,#desktop-type-toggle'))return;
    const el=ev.target.closest('.bridge-copy-target');if(!el||!isCandidate(el))return;
    ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
    const device=choosing,key=itemKey(el),v=db[device][key]||{};
    current={device,key,el,original:el.dataset.bridgeOriginal};
    const entry=document.getElementById(device+'-copy-text');
    entry.value=v.text||el.textContent||el.dataset.bridgeOriginal;
    const options=document.getElementById(device+'-copy-editor').querySelectorAll('[data-copy-align]');
    options.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.copyAlign===(v.align||'left'))));
    // Store the current alignment in the button-group closure through the active click callback.
    const match=Array.from(options).find(b=>b.dataset.copyAlign===(v.align||'left'));
    if(match)match.click();
    document.getElementById(device+'-copy-editor').hidden=false;
    panels[device].hidden=false;toggleChoice(device,false);entry.focus();
  },true);
  document.getElementById('mobile-type-reset').addEventListener('click',()=>{
    db.mobile={};legacy={};save();try{localStorage.removeItem('bridge_mobile_copy_breaks_v1')}catch(_){}
    toggleChoice('mobile',false);refresh();
  });
  document.getElementById('desktop-type-reset').addEventListener('click',()=>{
    db.desktop={};save();toggleChoice('desktop',false);refresh();
  });
  window.addEventListener('resize',refresh);
})();
</script>


<script>
/* V6.13 - design settings portable JSON; does not include any demo reservations/reviews. */
(function(){
 'use strict';
 const KEY={mobile:'bridge_mobile_type_v1',desktop:'bridge_desktop_type_v1',editor:'bridge_text_editor_v611',legacy:'bridge_mobile_copy_breaks_v1',wrap:'bridge_mobile_wrap_v1'};
 const defaultType={mobile:[100,170,16],desktop:[100,170,20]};
 const ranges={mobile:[[65,170],[140,195],[12,24]],desktop:[[65,170],[140,195],[14,30]]};
 const safeParse=(str,fallback)=>{try{return JSON.parse(str)}catch(_){return fallback}};
 const read=(key)=>{try{return localStorage.getItem(key)}catch(_){return null}};
 const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
 function validType(device,x){
   if(!Array.isArray(x)||x.length!==3)return null;
   return x.map((n,i)=>{
     const value=Number(n),[lo,hi]=ranges[device][i];
     if(!Number.isFinite(value))throw Error('글자 설정 값에 오류가 있습니다.');
     return Math.min(hi,Math.max(lo,Math.round(value)));
   });
 }
 function entriesFor(device){
   const saved=safeParse(read(KEY.editor),{});
   const edits=(saved&&typeof saved==='object'&&saved[device]&&typeof saved[device]==='object'&&!Array.isArray(saved[device]))?saved[device]:{};
   const clean={};
   for(const [k,v] of Object.entries(edits)){
     if(k.length>800||!v||typeof v!=='object'||typeof v.text!=='string'||v.text.length>650)continue;
     clean[k]={text:v.text,align:['left','center','right'].includes(v.align)?v.align:'left'};
   }
   // Include old mobile edits that predate the unified editor if still saved.
   if(device==='mobile'){
     const legacy=safeParse(read(KEY.legacy),{});
     if(legacy&&typeof legacy==='object')for(const [k,text] of Object.entries(legacy)){
       if(typeof text!=='string'||text.length>650||k.length>800)continue;
       const bits=k.split('|');const tag=(bits.shift()||'').toUpperCase();const original=bits.join('|');
       if(!original)continue;
       // The original V6.10 entries did not distinguish role/page, so keep them as legacy.
     }
   }
   return clean;
 }
 function deviceData(device){
   const type=validType(device,safeParse(read(KEY[device]),defaultType[device]))||defaultType[device];
   const data={typography:type,textEdits:entriesFor(device)};
   if(device==='mobile'){
     const wrap=read(KEY.wrap);data.wrap=['normal','keep-all','break-all'].includes(wrap)?wrap:'keep-all';
     const legacy=safeParse(read(KEY.legacy),{});
     if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy)){
       data.legacyTextEdits={};
       for(const [k,v] of Object.entries(legacy))if(k.length<800&&typeof v==='string'&&v.length<=650)data.legacyTextEdits[k]=v;
     }
   }
   return data;
 }
 function download(devices){
   const payload={format:'BRIDGE_DESIGN_SETTINGS',version:1,createdAt:new Date().toISOString(),gatewayFontPercent:115,devices:{}};
   for(const device of devices)payload.devices[device]=deviceData(device);
   const json=JSON.stringify(payload,null,2);
   const blob=new Blob([json],{type:'application/json;charset=utf-8'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;
   a.download='BRIDGE_디자인설정_'+(devices.length===2?'PC_모바일':devices[0]==='mobile'?'모바일':'PC')+'.json';
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 function validateEdits(x){
   if(!x||typeof x!=='object'||Array.isArray(x))throw Error('문구 설정 형식이 올바르지 않습니다.');
   if(Object.keys(x).length>1000)throw Error('문구 설정이 너무 많습니다.');
   const obj={};
   for(const [k,v] of Object.entries(x)){
     if(k.length>800||!v||typeof v!=='object'||typeof v.text!=='string'||v.text.length>650||!['left','center','right'].includes(v.align))throw Error('문구 설정 파일에 잘못된 항목이 있습니다.');
     obj[k]={text:v.text,align:v.align};
   }
   return obj;
 }
 function validate(data){
   if(!data||data.format!=='BRIDGE_DESIGN_SETTINGS'||data.version!==1||!data.devices||typeof data.devices!=='object')throw Error('BRIDGE 디자인 설정 JSON 파일이 아닙니다.');
   const cleaned={};
   for(const d of ['desktop','mobile'])if(hasOwn(data.devices,d)){
     const item=data.devices[d];
     if(!item||typeof item!=='object')throw Error('기기 설정이 올바르지 않습니다.');
     const type=validType(d,item.typography);
     if(!type)throw Error('글자 크기 설정이 올바르지 않습니다.');
     const edits=validateEdits(item.textEdits);
     const next={typography:type,textEdits:edits};
     if(d==='mobile'){
       if(!['normal','keep-all','break-all'].includes(item.wrap))throw Error('줄바꿈 방식 설정이 올바르지 않습니다.');
       next.wrap=item.wrap;
       if(item.legacyTextEdits!==undefined){
         if(!item.legacyTextEdits||typeof item.legacyTextEdits!=='object'||Array.isArray(item.legacyTextEdits)||Object.keys(item.legacyTextEdits).length>1000)throw Error('이전 편집 설정이 올바르지 않습니다.');
         next.legacyTextEdits={};
         for(const [k,v] of Object.entries(item.legacyTextEdits)){
           if(k.length>800||typeof v!=='string'||v.length>650)throw Error('이전 편집 설정에 잘못된 항목이 있습니다.');
           next.legacyTextEdits[k]=v;
         }
       }
     }
     cleaned[d]=next;
   }
   if(!Object.keys(cleaned).length)throw Error('PC 또는 모바일 설정이 없습니다.');
   return cleaned;
 }
 function importData(devices){
   // Merge by device rather than replacing the other device's changes.
   const current=safeParse(read(KEY.editor),{});
   const previous=(current&&typeof current==='object'&&!Array.isArray(current))?current:{};
   const copy={mobile:{...(previous.mobile||{})},desktop:{...(previous.desktop||{})}};
   const changes=[];
   for(const [d,item] of Object.entries(devices)){
     copy[d]={...copy[d],...item.textEdits};
     changes.push([KEY[d],JSON.stringify(item.typography)]);
     if(d==='mobile'){
       changes.push([KEY.wrap,item.wrap]);
       if(item.legacyTextEdits){
         const old=safeParse(read(KEY.legacy),{});
         changes.push([KEY.legacy,JSON.stringify({...((old&&typeof old==='object')?old:{}),...item.legacyTextEdits})]);
       }
     }
   }
   changes.push([KEY.editor,JSON.stringify(copy)]);
   // If storage is too small, recover the previous state on this same browser.
   const backups=changes.map(([k])=>[k,read(k)]);
   try{for(const [k,v] of changes)localStorage.setItem(k,v)}catch(error){
     for(const [k,v] of backups)try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}
     throw Error('브라우저 저장 공간이 부족해 설정을 불러오지 못했습니다.');
   }
 }
 for(const device of ['desktop','mobile']){
   const name=device==='mobile'?'모바일':'PC';
   document.getElementById(device+'-design-export').addEventListener('click',()=>download([device]));
   document.getElementById(device+'-design-both').addEventListener('click',()=>download(['desktop','mobile']));
   const file=document.getElementById(device+'-design-file');
   document.getElementById(device+'-design-import').addEventListener('click',()=>file.click());
   file.addEventListener('change',async()=>{
     const chosen=file.files&&file.files[0];file.value='';if(!chosen)return;
     if(chosen.size>1024*1024){alert('설정 파일은 1MB 이하여야 합니다.');return;}
     try{
       const data=validate(JSON.parse(await chosen.text()));
       const kinds=Object.keys(data).map(d=>d==='mobile'?'모바일':'PC').join(' + ');
       if(!confirm(kinds+' 디자인 설정을 불러올까요?\n이미 있는 문구 수정과 병합되며, 같은 문구는 불러온 설정이 우선합니다.\n예약·후기 등 시연 데이터는 변경하지 않습니다.'))return;
       importData(data);
       alert(kinds+' 디자인 설정을 불러왔습니다. 화면을 새로고침합니다.');
       location.reload();
     }catch(error){alert('디자인 파일을 불러오지 못했습니다.\n'+(error&&error.message||'파일을 확인해 주세요.'))}
   });
 }
})();
</script>
